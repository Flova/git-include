name: Release

on:
  push:
    tags: ["v*"]
  # Without a tag input: a dry run that builds every artifact and the
  # SHA256SUMS manifest as workflow artifacts but publishes nothing.
  # With one: a full release — the tag is created (on the default
  # branch's head) together with the GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Empty = dry run."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # All binaries are built with the pixi-pinned toolchain (`dist`
  # environment in pixi.toml) — no rustup, no apt.
  binaries:
    name: Binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two Linux flavors, the user's choice (install.sh picks
          # automatically): plain -gnu links the distro's OpenSSL and
          # zlib dynamically (preferred, nothing bundled); -portable
          # compiles OpenSSL and zlib in and needs only glibc >= 2.28.
          - asset: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            task: dist-dynamic
            target: x86_64-unknown-linux-gnu
          - asset: x86_64-unknown-linux-gnu-portable
            os: ubuntu-latest
            task: dist-portable
            target: x86_64-unknown-linux-gnu
          - asset: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            task: dist-dynamic
            target: aarch64-unknown-linux-gnu
          - asset: aarch64-unknown-linux-gnu-portable
            os: ubuntu-24.04-arm
            task: dist-portable
            target: aarch64-unknown-linux-gnu
          # macOS: TLS goes through the system Security framework;
          # OpenSSL is compiled in only for libssh2 (SSH support), since
          # macOS ships no OpenSSL to link against. No Intel build —
          # macos-13 runners take forever to schedule; Intel Mac users
          # can `cargo install git-include`.
          - asset: aarch64-apple-darwin
            os: macos-latest
            task: dist
            target: aarch64-apple-darwin
          # Windows uses the OS TLS stack; nothing to vendor.
          - asset: x86_64-pc-windows-msvc
            os: windows-latest
            task: dist
            target: x86_64-pc-windows-msvc
          - asset: aarch64-pc-windows-msvc
            os: windows-11-arm
            task: dist
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.72.2
          environments: dist
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}
      - run: pixi run -e dist ${{ matrix.task }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/git-include.exe" "dist/git-include-${{ matrix.asset }}.exe"
          else
            cp "target/${{ matrix.target }}/release/git-include" "dist/git-include-${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  msi:
    name: Windows MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.72.2
          environments: dist
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run -e dist cargo install cargo-wix --locked
      - name: Compute numeric MSI version
        shell: bash
        run: |
          # MSI ProductVersion must be purely numeric; strip any
          # pre-release suffix (0.1.0-alpha.1 -> 0.1.0).
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "MSI_VERSION=${v%%-*}" >> "$GITHUB_ENV"
      - run: pixi run -e dist dist-msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  conda:
    name: Conda package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No osx-64: macos-13 (Intel) runners take forever to schedule.
          - { platform: linux-64,      os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-arm64,     os: macos-latest }
          - { platform: win-64,        os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.72.2
          environments: build
          cache: true
      - name: Build conda package
        run: pixi run -e build conda-build --target-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.platform }}
          path: dist/**/*.conda
          if-no-files-found: error

  publish:
    name: Collect artifacts & publish
    needs: [binaries, msi, conda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Collect conda packages at top level
        run: find assets -name '*.conda' -exec mv {} assets/ \; || true
      - name: Generate SHA256SUMS
        run: |
          cd assets
          for f in *; do [ -f "$f" ] && sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS
      # On a dry run (workflow_dispatch) the manifest plus all artifacts
      # stay inspectable as workflow artifacts; nothing is published.
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || inputs.tag != ''
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: |
            assets/git-include-*
            assets/*.conda
            assets/SHA256SUMS
          generate_release_notes: true
      # Optional: publish the conda package to an anaconda.org channel when
      # a token is configured (Settings -> Secrets -> ANACONDA_API_TOKEN).
      - name: Upload to anaconda.org
        if: ${{ (github.ref_type == 'tag' || inputs.tag != '') && env.ANACONDA_API_TOKEN != '' }}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          pipx install anaconda-client
          anaconda -t "$ANACONDA_API_TOKEN" upload --force assets/*.conda
