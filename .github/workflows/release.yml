name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: builds every artifact and the SHA256SUMS manifest as workflow
  # artifacts, but publishes no GitHub release and uploads nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux download binaries are fully static (musl + vendored
          # OpenSSL + vendored libgit2): a single ELF that runs on any
          # distro, regardless of glibc or libssl version.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            flags: --features vendored-openssl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            flags: --features vendored-openssl
          # macOS binaries vendor OpenSSL too, so they don't depend on a
          # Homebrew libssl being present.
          - target: x86_64-apple-darwin
            os: macos-13
            flags: --features vendored-openssl
          - target: aarch64-apple-darwin
            os: macos-latest
            flags: --features vendored-openssl
          # Windows uses the OS TLS stack; nothing to vendor.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            flags: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      # The toolchain version comes from rust-toolchain.toml; rustup
      # installs and uses it automatically for commands run in the repo.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/git-include.exe" "dist/git-include-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/git-include" "dist/git-include-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  msi:
    name: Windows MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-wix --locked
      - run: cargo wix --nocapture --output dist/git-include-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  conda:
    name: Conda package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-64,      os: ubuntu-latest }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: osx-64,        os: macos-13 }
          - { platform: osx-arm64,     os: macos-latest }
          - { platform: win-64,        os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi (pinned rattler-build)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.72.2 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - name: Install pixi (pinned rattler-build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PIXI_VERSION = "v0.72.2"
          iwr -useb https://pixi.sh/install.ps1 | iex
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.pixi\bin"
      - name: Build conda package
        run: pixi run -e build conda-build --target-platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.platform }}
          path: dist/**/*.conda
          if-no-files-found: error

  publish:
    name: Collect artifacts & publish
    needs: [binaries, msi, conda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Collect conda packages at top level
        run: find assets -name '*.conda' -exec mv {} assets/ \; || true
      - name: Generate SHA256SUMS
        run: |
          cd assets
          for f in *; do [ -f "$f" ] && sha256sum "$f"; done > SHA256SUMS
          cat SHA256SUMS
      # On a dry run (workflow_dispatch) the manifest plus all artifacts
      # stay inspectable as workflow artifacts; nothing is published.
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            assets/git-include-*
            assets/*.conda
            assets/SHA256SUMS
          generate_release_notes: true
      # Optional: publish the conda package to an anaconda.org channel when
      # a token is configured (Settings -> Secrets -> ANACONDA_API_TOKEN).
      - name: Upload to anaconda.org
        if: ${{ github.ref_type == 'tag' && env.ANACONDA_API_TOKEN != '' }}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          pipx install anaconda-client
          anaconda -t "$ANACONDA_API_TOKEN" upload --force assets/*.conda
