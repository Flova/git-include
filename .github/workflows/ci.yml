name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi (pinned dev environment)
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.72.2 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: pixi run test
      - run: pixi run build
      - name: Check the package-manager build (self-update disabled)
        run: pixi run check-minimal

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pixi (pinned dev environment)
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.72.2 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: pixi run lint
