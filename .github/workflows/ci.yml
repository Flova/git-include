name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.72.2
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run test
      - run: pixi run build
      - name: Check the package-manager build (self-update disabled)
        run: pixi run check-minimal

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          pixi-version: v0.72.2
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run lint
