[package]
name = "git-include"
version = "0.1.2"
edition = "2024"
rust-version = "1.96"
description = "A modern git-subrepo alternative: vendor external repositories as plain files with full two-way sync"
license = "MIT"
repository = "https://github.com/flova/git-include"
readme = "README.md"
keywords = ["git", "subrepo", "vendoring", "monorepo", "submodule"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-include"
path = "src/main.rs"

# Applies to every target in the package (binary and integration tests).
[lints.rust]
unsafe_code = "forbid"

[features]
default = ["self-update", "vendored-libgit2"]
# Compiles the `git include self-update` command. Package-manager builds
# (conda, distro packages) disable this: there, updating is the package
# manager's job, and a self-replacing binary would fight it.
self-update = ["dep:sha2"]
# Statically build and embed libgit2, so the binaries git-include ships
# itself (curl install, MSI, `cargo install`) carry no system libgit2
# dependency. On by default; conda builds turn it off (via
# --no-default-features) and link conda-forge's own libgit2 instead —
# vendoring a library the package manager already ships is not allowed
# there. Rust crates are still linked statically either way; only the
# libgit2 C library is affected.
vendored-libgit2 = ["git2/vendored-libgit2"]
# Compile OpenSSL in. Used for the portable Linux binaries (no system
# libssl required) and the macOS binaries (macOS ships no OpenSSL;
# only libssh2 needs it there — TLS uses the Security framework).
vendored-openssl = ["git2/vendored-openssl"]

[dependencies]
anyhow = "1.0.103"
auth-git2 = "0.6.0"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.7"
git2 = { version = "0.21.0", features = ["https", "ssh", "cred"] }
minijinja = "2.21.0"
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
