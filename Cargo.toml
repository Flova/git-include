[package]
name = "git-include"
version = "0.1.0-alpha.4"
edition = "2024"
rust-version = "1.96"
description = "A modern git-subrepo alternative: vendor external repositories as plain files with full two-way sync"
license = "MIT"
repository = "https://github.com/flova/git-include"
readme = "README.md"
keywords = ["git", "subrepo", "vendoring", "monorepo", "submodule"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-include"
path = "src/main.rs"

# Applies to every target in the package (binary and integration tests).
[lints.rust]
unsafe_code = "forbid"

[features]
default = ["self-update"]
# Compiles the `git include self-update` command. Package-manager builds
# (conda, distro packages) disable this: there, updating is the package
# manager's job, and a self-replacing binary would fight it.
self-update = ["dep:sha2"]
# Compile OpenSSL in. Used for the portable Linux binaries (no system
# libssl required) and the macOS binaries (macOS ships no OpenSSL;
# only libssh2 needs it there — TLS uses the Security framework).
vendored-openssl = ["git2/vendored-openssl"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.7"
git2 = { version = "0.21.0", features = ["https", "ssh", "cred", "vendored-libgit2"] }
minijinja = "2.21.0"
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
