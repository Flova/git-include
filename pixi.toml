# Pinned development and build environment (https://pixi.sh).
#
#   pixi run test        # full test suite (git-lfs included)
#   pixi run lint        # rustfmt + clippy, as CI runs them
#   pixi run build       # release binary for the host platform
#   pixi run -e build conda-build   # build the conda package via rattler-build
#
# The Rust version here matches rust-toolchain.toml, which pins the same
# version for the rustup-based release-binary builds. Bump both together.
# Exact versions of everything (transitive included) live in pixi.lock.

[workspace]
name = "git-include"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
rust = "=1.96.1"
# vendored libgit2 (and openssl-sys on unix) compile C at build time
c-compiler = "*"
git = "*"
git-lfs = "*"

[target.unix.dependencies]
pkg-config = "*"
openssl = "3.*"
zlib = "*"

[tasks]
test = "cargo test"
lint = { depends-on = ["fmt-check", "clippy"] }
fmt-check = "cargo fmt --check"
fmt = "cargo fmt"
clippy = "cargo clippy --all-targets -- -D warnings"
build = "cargo build --release"
# the conda/package-manager configuration (self-update disabled)
check-minimal = "cargo check --no-default-features"

[feature.build.dependencies]
rattler-build = ">=0.40"

[feature.build.tasks]
conda-build = "rattler-build build --recipe conda/recipe.yaml --output-dir dist"

[environments]
build = { features = ["build"], no-default-feature = true }
